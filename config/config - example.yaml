MQTT:
    MQTT_ip: 192.168.XXX.XXX
    MQTT_ID: "ipmi-mqtt-server"
    MQTT_USER: 'MQTTUSER'
    MQTT_PW: 'MQTTPASSWORD'
    HA_BINARY: 'homeassistant/binary_sensor' # MQTT topics for home assistant to automatically detect devices
    HA_SENSOR: 'homeassistant/sensor'
    HA_SWITCH: 'homeassistant/switch'
    TIME_PERIOD: 300 # Time to try to get new sensor values. Set to 0 for one time execution.

TOPICS:
    POWER: 'server_power_state' #This is to get the server's ON OFF state, if you don't want it just leave an empty string
    #SWITCH: 'server_switch' # UNCOMMENT THE SWITCH LINE IF YOU WANT TO USE A SWITCH
    SDR_TYPES: #THESE ARE JUST EXAMPLES OF NAMES FOR THE SENSORS, ITS A DICTIONARY SO THE first part (before :) can be whatever you want, just ensure it matches the value in SDR TYPE for this description.
        1: 'server_cpu_temp' 
        2: 'server_system_temp'
        3:  'server_cpu_fan'
        4:  'server_bmc_voltage'
        5: 'dell_ambient_temp'
        6: 'dell_fan_mod_1a_rpm'
        7: 'dell_fan_mod_1b_rpm'
        8: 'dell_fan_mod_2a_rpm'
        9: 'dell_fan_mod_2b_rpm'
        10: 'dell_fan_mod_3a_rpm'
        11: 'dell_fan_mod_3b_rpm'
        12: 'dell_fan_mod_4a_rpm'
        13: 'dell_fan_mod_4b_rpm'
        14: 'dell_fan_mod_5a_rpm'
        15: 'dell_fan_mod_5b_rpm'
        16: 'dell_psu_1_current'
        17: 'dell_psu_2_current'
        18: 'dell_psu_1_voltage'
        19: 'dell_psu_2_voltage'
        20: 'dell_system_power'
SERVERS:
      - IPMI_NODENAME: XXXXX 
        BRAND: ASUS #THIS IS AN ASUS EXAMPLE
        IPMI_IP: 192.168.XXX.XXX
        IPMI_USER: 'SERVER IPMI USER'
        IPMI_PASSWORD: 'SERVER IPMI PASSWORD'
        SDRS:
            - SDR_TYPE: 1
              SDR_CLASS: temperature #THERE ARE THREE CLASSES - temperature fan and voltage
              SUBCLASS: MB Temp 
              VALUE: 3.0
            - SDR_TYPE: 2
              SDR_CLASS: fan
              SUBCLASS: XXXX
              VALUE: XXXX
            - SDR_TYPE: XXXX
              SDR_CLASS: voltage
              SUBCLASS: XXX
              VALUE: XXX
      - IPMI_NODENAME: XXXXXXX
        BRAND: SUPERMICRO #THIS IS A SUPERMICRO EXAMPLE
        IPMI_IP: 192.168.XXX.XXX
        IPMI_USER: 'SERVER IPMI USER'
        IPMI_PASSWORD: 'SERVER IPMI PASSWORD'
        SDRS: # YOU CAN ADD ALL THE SDRS YOU WAN
            - SDR_TYPE: XXX
              VALUE: XXXX
              SDR_CLASS: XXXX
            - SDR_TYPE: XXXX
              VALUE: XXX
              SDR_CLASS: XXXX
      - IPMI_NODENAME: DELL-IDRAC6
        BRAND: DELL #THIS IS A DELL 11TH GENERATION / iDRAC6 EXAMPLE. SDRS CAN BE OMITTED TO PUBLISH ALL VISIBLE SENSORS.
        IPMI_IP: 192.168.XXX.XXX
        IPMI_USER: 'SERVER IPMI USER'
        IPMI_PASSWORD: 'SERVER IPMI PASSWORD'
        SDRS: # OPTIONAL: USE THIS LIST ONLY TO LIMIT OR RENAME THE PUBLISHED SENSORS.
            - SDR_TYPE: 5
              SDR_CLASS: temperature
              SUBCLASS: Ambient Temp
              VALUE: 7.1
            - SDR_TYPE: 6
              SDR_CLASS: fan
              SUBCLASS: FAN MOD 1A RPM
              VALUE: 7.1
            - SDR_TYPE: 7
              SDR_CLASS: fan
              SUBCLASS: FAN MOD 1B RPM
              VALUE: 7.1
            - SDR_TYPE: 8
              SDR_CLASS: fan
              SUBCLASS: FAN MOD 2A RPM
              VALUE: 7.1
            - SDR_TYPE: 9
              SDR_CLASS: fan
              SUBCLASS: FAN MOD 2B RPM
              VALUE: 7.1
            - SDR_TYPE: 10
              SDR_CLASS: fan
              SUBCLASS: FAN MOD 3A RPM
              VALUE: 7.1
            - SDR_TYPE: 11
              SDR_CLASS: fan
              SUBCLASS: FAN MOD 3B RPM
              VALUE: 7.1
            - SDR_TYPE: 12
              SDR_CLASS: fan
              SUBCLASS: FAN MOD 4A RPM
              VALUE: 7.1
            - SDR_TYPE: 13
              SDR_CLASS: fan
              SUBCLASS: FAN MOD 4B RPM
              VALUE: 7.1
            - SDR_TYPE: 14
              SDR_CLASS: fan
              SUBCLASS: FAN MOD 5A RPM
              VALUE: 7.1
            - SDR_TYPE: 15
              SDR_CLASS: fan
              SUBCLASS: FAN MOD 5B RPM
              VALUE: 7.1
            - SDR_TYPE: 16
              SDR_CLASS: current
              SUBCLASS: Current
              VALUE: 10.1
            - SDR_TYPE: 17
              SDR_CLASS: current
              SUBCLASS: Current
              VALUE: 10.2
            - SDR_TYPE: 18
              SDR_CLASS: voltage
              SUBCLASS: Voltage
              VALUE: 10.1
            - SDR_TYPE: 19
              SDR_CLASS: voltage
              SUBCLASS: Voltage
              VALUE: 10.2
            - SDR_TYPE: 20
              SDR_CLASS: power
              SUBCLASS: System Level
              VALUE: 7.1
